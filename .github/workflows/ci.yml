name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  RUST_BACKTRACE: 1

jobs:
  workspace:
    name: Workspace (Rust 1.100)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --all --check
      - name: Check core dependency boundary
        run: python3 scripts/check_core_dependencies.py
      - name: Check portable core and egui libraries
        run: >-
          cargo check --package dockspace --package egui_dockspace --lib
          --target wasm32-unknown-unknown --features egui_dockspace/serde --locked
      - name: Check selectable egui host backends
        run: |
          cargo check --package egui_dockspace --no-default-features --features winit,x11 --lib --locked
          cargo check --package egui_dockspace --no-default-features --features winit,wayland --lib --locked
      - name: Check selectable winit native helpers and backends
        run: |
          cargo check --package dockspace_winit --no-default-features --features x11,native-windows --lib --locked
          cargo check --package dockspace_winit --no-default-features --features wayland,native-geometry --lib --locked
      - name: Check Python syntax
        run: python3 -m compileall -q scripts integration/egui-native-smoke
      - name: Check correctness lints
        run: >-
          cargo clippy --workspace --all-features --all-targets --locked --
          -A warnings -D clippy::correctness -D clippy::suspicious
      - name: Build strict documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: >-
          cargo doc --package dockspace --package dockspace_winit --package egui_dockspace
          --all-features --no-deps --locked
      - name: Run workspace tests
        run: >-
          cargo nextest run --workspace --all-features --all-targets --locked
      - name: Run core layout example
        run: cargo run --package dockspace --example layout_commands --locked
      - name: Run documentation tests
        run: cargo test --doc --workspace --all-features --locked

  engine-host:
    name: Independent engine host consumer (MSRV)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: integration/dockspace-host-harness -> target
      - name: Format public host consumer
        run: >-
          cargo fmt --manifest-path integration/dockspace-host-harness/Cargo.toml
          --all --check
      - name: Run public host contract without optional features
        run: >-
          cargo nextest run
          --manifest-path integration/dockspace-host-harness/Cargo.toml --locked
      - name: Run public host contract with persistence and motion
        run: >-
          cargo nextest run
          --manifest-path integration/dockspace-host-harness/Cargo.toml
          --features serde,motion --locked
      - name: Run engine-owned output example
        run: >-
          cargo run --manifest-path integration/dockspace-host-harness/Cargo.toml
          --example engine_host --locked

  official-egui:
    name: Official egui consumer (MSRV)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            integration/egui-official-harness -> target
            integration/egui-product-harness -> target
      - name: Run public API and caller-owned editor workflows
        run: >-
          cargo nextest run --manifest-path integration/egui-official-harness/Cargo.toml
          --all-features --all-targets --locked
      - name: Run default-feature product harness
        run: >-
          cargo nextest run --manifest-path integration/egui-product-harness/Cargo.toml
          --all-targets --locked
      - name: Run product harness with persistence support
        run: >-
          cargo nextest run --manifest-path integration/egui-product-harness/Cargo.toml
          --features serde --all-targets --locked

  native-platform-check:
    name: Native compile (MSRV, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      RUSTUP_TOOLCHAIN: 1.95.0
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: integration/egui-fork-workspace -> target
      - name: Check native adapter library
        run: >-
          cargo check --manifest-path integration/egui-fork-workspace/Cargo.toml
          --package egui_dockspace_native --lib --all-features --locked
      - name: Check renderer-neutral winit hosts
        run: >-
          cargo check --package dockspace_winit --all-features --all-targets --locked

  fork-native:
    name: Fork-backed native coordinator (Rust 1.100)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: native-linux
          workspaces: |
            . -> target
            integration/egui-fork-workspace -> target
      - name: Install native build and renderer smoke dependencies
        timeout-minutes: 10
        run: |
          # Avoid slow regional HTTP mirrors and flaky third-party apt sources on hosted runners.
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/microsoft*.sources
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 install --no-install-recommends -y \
            libegl1 libgl1-mesa-dri libwayland-dev libxkbcommon-x11-0 openbox x11-utils xauth xvfb
      - name: Exercise renderer-neutral native window lifecycle
        run: |
          cargo build --package dockspace_winit --example multiview --no-default-features --features x11,native,example-app --locked
          xvfb-run -a --server-args="-screen 0 1280x1024x24" python3 integration/egui-native-smoke/with_openbox.py -- target/debug/examples/multiview --smoke
      - name: Check native workspace formatting
        run: >-
          cargo fmt --manifest-path integration/egui-fork-workspace/Cargo.toml
          --all --check
      - name: Exercise official WGPU surface recovery
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          LP_NUM_THREADS: "1"
        run: |
          cargo test --package egui_dockspace --lib --features wgpu --no-run --locked
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            python3 integration/egui-native-smoke/with_openbox.py --timeout 120 -- \
            cargo nextest run --package egui_dockspace --lib --features wgpu --locked \
            --test-threads=1 --run-ignored only -E 'test(real_wgpu_surface_recovery_)'
      - name: Check native adapter without optional features
        run: >-
          cargo check --manifest-path integration/egui-fork-workspace/Cargo.toml
          --package egui_dockspace_native --lib --no-default-features --locked
      - name: Run native workspace and smoke unit tests
        run: >-
          cargo nextest run --manifest-path integration/egui-fork-workspace/Cargo.toml
          --workspace --all-targets --all-features --locked
      - name: Exercise real output publication and backpressure
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          LP_NUM_THREADS: "1"
        run: >-
          xvfb-run -a --server-args="-screen 0 1280x1024x24"
          python3 integration/egui-native-smoke/with_openbox.py --
          cargo nextest run --manifest-path integration/egui-fork-workspace/Cargo.toml
          --package egui_dockspace_native --lib --all-features --locked
          --test-threads=1
          -E 'test(real_eframe_actual_passes_publish_) | test(real_eframe_style_publishes_) | test(real_eframe_first_root_output_attaches_) | test(real_eframe_output_capacity_retains_) | test(stable_unfocused_observations_idle_)'
