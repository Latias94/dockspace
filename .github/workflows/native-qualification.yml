name: Native qualification

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: native-qualification-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  RUST_BACKTRACE: 1
  LIBGL_ALWAYS_SOFTWARE: "1"
  LP_NUM_THREADS: "1"
  WINIT_UNIX_BACKEND: x11
  WINIT_X11_SCALE_FACTOR: "1"
  DOCKSPACE_X11_CAPTURE_TEST: "1"
  QUALIFICATION_LOG_DIR: integration/egui-fork-workspace/target/qualification

jobs:
  x11:
    name: Real-window and physical X11 journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-linux
          workspaces: |
            . -> target
            integration/egui-fork-workspace -> target
      - name: Install X11 build and runtime dependencies
        timeout-minutes: 5
        run: >-
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/microsoft*.sources &&
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20
          -o Acquire::https::Timeout=20 update &&
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20
          -o Acquire::https::Timeout=20 install --no-install-recommends -y
          libwayland-dev libxkbcommon-x11-0 mesa-vulkan-drivers openbox x11-utils xauth xdotool xvfb
      - name: Record source and toolchain
        run: |
          rm -rf "$QUALIFICATION_LOG_DIR"
          mkdir -p "$QUALIFICATION_LOG_DIR"
          git rev-parse HEAD > "$QUALIFICATION_LOG_DIR/source.txt"
          rustc -Vv > "$QUALIFICATION_LOG_DIR/rustc.txt"
          uname -a > "$QUALIFICATION_LOG_DIR/platform.txt"
      - name: Build native smoke applications
        run: >-
          cargo build --manifest-path integration/egui-fork-workspace/Cargo.toml
          --package egui-native-smoke --bins --locked
      - name: Build editor and moving-window examples
        run: >-
          cargo build --manifest-path integration/egui-fork-workspace/Cargo.toml
          --package egui_dockspace_native --example basic --example solar_system --all-features --locked
      - name: Build official winit runner with system accessibility
        run: >-
          cargo build --package egui_dockspace --example workbench
          --features wgpu,accesskit --locked
      - name: Build independent software host
        run: >-
          cargo build --package dockspace_winit --example software
          --features example-app --locked
      - name: Exercise software output with synthetic winit input
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            python3 integration/egui-native-smoke/with_openbox.py --timeout 60 -- \
            target/debug/examples/software --smoke \
            2>&1 | tee "$QUALIFICATION_LOG_DIR/software.log"
          grep -Fq 'software smoke passed:' "$QUALIFICATION_LOG_DIR/software.log"
      - name: Exercise official winit startup and complete output
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            python3 integration/egui-native-smoke/with_openbox.py --timeout 120 -- \
            target/debug/examples/workbench --exercise "$QUALIFICATION_LOG_DIR/official-winit.csv" \
            2>&1 | tee "$QUALIFICATION_LOG_DIR/official-winit.log"
          grep -Fq 'egui-host-exercise: complete;' "$QUALIFICATION_LOG_DIR/official-winit.log"
      - name: Exercise actual output, input, capture and lifecycle boundaries
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24 +extension RANDR +extension XTEST" \
            python3 integration/egui-native-smoke/with_openbox.py --timeout 600 -- \
            cargo nextest run --manifest-path integration/egui-fork-workspace/Cargo.toml \
            --package egui_dockspace_native --all-features --all-targets --locked \
            --test-threads=1 --run-ignored all \
            -E 'test(real_) | test(failed_native_creation_releases_the_example_presentation_wait)' \
            2>&1 | tee "$QUALIFICATION_LOG_DIR/native-tests.log"
      - name: Exercise public native pane commands
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            python3 integration/egui-native-smoke/with_openbox.py -- \
            integration/egui-fork-workspace/target/debug/examples/basic --command-smoke \
            2>&1 | tee "$QUALIFICATION_LOG_DIR/commands.log"
          grep -Fq 'command-smoke: complete;' "$QUALIFICATION_LOG_DIR/commands.log"
      - name: Exercise moving child windows and recreation
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            python3 integration/egui-native-smoke/with_openbox.py -- \
            integration/egui-fork-workspace/target/debug/examples/solar_system --smoke \
            2>&1 | tee "$QUALIFICATION_LOG_DIR/solar-system.log"
          grep -Fq 'solar-smoke: PASS' "$QUALIFICATION_LOG_DIR/solar-system.log"
      - name: Qualify editor docking, text, restore and Root continuity
        timeout-minutes: 8
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24 +extension RANDR +extension XTEST" \
            python3 integration/egui-native-smoke/qualify_editor.py --start-openbox \
            integration/egui-fork-workspace/target/debug/examples/basic \
            2>&1 | tee "$QUALIFICATION_LOG_DIR/editor.log"
      - name: Exercise programmatic native redock
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            python3 integration/egui-native-smoke/with_openbox.py -- \
            integration/egui-fork-workspace/target/debug/egui-native-smoke \
            2>&1 | tee "$QUALIFICATION_LOG_DIR/redock.log"
      - name: Exercise native close policies through the window manager
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24 +extension XTEST" \
            python3 integration/egui-native-smoke/with_openbox.py -- \
            python3 integration/egui-native-smoke/close_x11.py \
            integration/egui-fork-workspace/target/debug/egui-native-smoke \
            2>&1 | tee "$QUALIFICATION_LOG_DIR/close.log"
      - name: Exercise fatal teardown and fresh native host recovery
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            python3 integration/egui-native-smoke/with_openbox.py --timeout 90 -- \
            integration/egui-fork-workspace/target/debug/egui-native-recovery-smoke \
            2>&1 | tee "$QUALIFICATION_LOG_DIR/recovery.log"
          grep -Fq 'recovery-smoke: PASS;' "$QUALIFICATION_LOG_DIR/recovery.log"
      - name: Exercise physical drag-out and redock
        env:
          EGUI_INSPECTION: "127.0.0.1:5719"
        run: |
          xvfb-run -a --server-args="-screen 0 1280x800x24 +extension RANDR +extension XTEST" \
            python3 integration/egui-native-smoke/with_openbox.py -- \
            integration/egui-fork-workspace/target/debug/egui-native-physical-smoke \
            2>&1 | tee "$QUALIFICATION_LOG_DIR/physical.log"
      - name: Upload qualification logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-x11-${{ github.sha }}
          path: integration/egui-fork-workspace/target/qualification
          if-no-files-found: ignore

  wayland:
    name: Physical Wayland input and output scaling
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-linux
          workspaces: |
            . -> target
            integration/egui-fork-workspace -> target
      - name: Install headless Wayland dependencies
        timeout-minutes: 5
        run: >-
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/microsoft*.sources &&
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20
          -o Acquire::https::Timeout=20 update &&
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20
          -o Acquire::https::Timeout=20 install --no-install-recommends -y
          libwayland-dev libxkbcommon-x11-0 libgl1-mesa-dri mesa-vulkan-drivers sway wtype grim
      - name: Record source and toolchain
        run: |
          rm -rf "$QUALIFICATION_LOG_DIR"
          mkdir -p "$QUALIFICATION_LOG_DIR"
          git rev-parse HEAD > "$QUALIFICATION_LOG_DIR/source.txt"
          rustc -Vv > "$QUALIFICATION_LOG_DIR/rustc.txt"
          uname -a > "$QUALIFICATION_LOG_DIR/platform.txt"
      - name: Build official winit runner with system accessibility
        run: >-
          cargo build --package egui_dockspace --example workbench
          --features wgpu,accesskit --locked
      - name: Build native local docking editor
        run: >-
          cargo build --manifest-path integration/egui-fork-workspace/Cargo.toml
          --package egui_dockspace_native --example basic --all-features --locked
      - name: Build real Wayland pointer device
        run: >-
          cargo build --manifest-path integration/egui-fork-workspace/Cargo.toml
          --package egui-native-smoke --bin wayland_seat --locked
      - name: Exercise physical docking and ordinary content
        run: |
          python3 integration/egui-native-smoke/with_sway.py --timeout 90 \
            --artifacts "$QUALIFICATION_LOG_DIR/wayland-baseline" \
            --seat-helper integration/egui-fork-workspace/target/debug/wayland_seat -- \
            python3 integration/egui-native-smoke/editor_docking_wayland.py \
            target/debug/examples/workbench --artifacts "$QUALIFICATION_LOG_DIR/wayland-baseline/editor" \
            2>&1 | tee "$QUALIFICATION_LOG_DIR/wayland-baseline.log"
      - name: Exercise a real output scale change
        run: |
          python3 integration/egui-native-smoke/with_sway.py --timeout 90 \
            --artifacts "$QUALIFICATION_LOG_DIR/wayland-scale" \
            --seat-helper integration/egui-fork-workspace/target/debug/wayland_seat -- \
            python3 integration/egui-native-smoke/editor_docking_wayland.py \
            target/debug/examples/workbench --change-scale --artifacts "$QUALIFICATION_LOG_DIR/wayland-scale/editor" \
            2>&1 | tee "$QUALIFICATION_LOG_DIR/wayland-scale.log"
      - name: Exercise fractional output scaling (1.5x to 1.25x)
        run: |
          python3 integration/egui-native-smoke/with_sway.py --timeout 90 \
            --output-mode 2400x1800 --scale 1.5 \
            --artifacts "$QUALIFICATION_LOG_DIR/wayland-fractional" \
            --seat-helper integration/egui-fork-workspace/target/debug/wayland_seat -- \
            python3 integration/egui-native-smoke/editor_docking_wayland.py \
            target/debug/examples/workbench \
            --expect-initial-scale 1.5 --target-scale 1.25 --target-mode 2000x1500 \
            --artifacts "$QUALIFICATION_LOG_DIR/wayland-fractional/editor" \
            2>&1 | tee "$QUALIFICATION_LOG_DIR/wayland-fractional.log"
      - name: Exercise seven native local docking journeys
        timeout-minutes: 5
        run: |
          python3 integration/egui-native-smoke/with_sway.py --timeout 240 \
            --artifacts "$QUALIFICATION_LOG_DIR/wayland-native" \
            --seat-helper integration/egui-fork-workspace/target/debug/wayland_seat -- \
            python3 integration/egui-native-smoke/native_docking_wayland.py \
            integration/egui-fork-workspace/target/debug/examples/basic \
            --artifacts "$QUALIFICATION_LOG_DIR/wayland-native/editor" \
            2>&1 | tee "$QUALIFICATION_LOG_DIR/wayland-native.log"
      - name: Upload Wayland qualification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wayland-${{ github.sha }}
          path: integration/egui-fork-workspace/target/qualification
          if-no-files-found: ignore
