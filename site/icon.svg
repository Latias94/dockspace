<svg xmlns="http://www.w3.org/2000/svg"
     width="256" height="256"
     viewBox="0 0 96 96"
     role="img"
     aria-labelledby="title desc">
  <title id="title">Dockspace</title>
  <desc id="desc">
    A split workspace with a detached multiview group.
  </desc>

  <defs>
    <!-- Inner radius = outer radius - 5 -->
    <clipPath id="workspace-clip">
      <rect x="11" y="14"
            width="64" height="60" rx="8"/>
    </clipPath>

    <clipPath id="floating-clip">
      <rect x="54" y="56"
            width="32" height="26" rx="6"/>
    </clipPath>

    <!-- Separation between the two layers -->
    <mask id="workspace-mask"
          maskUnits="userSpaceOnUse"
          x="0" y="0" width="96" height="96">
      <rect width="96" height="96" fill="white"/>
      <rect x="47.5" y="49.5"
            width="45" height="39"
            rx="12.5" fill="black"/>
    </mask>
  </defs>

  <!-- Main docking workspace -->
  <g mask="url(#workspace-mask)">
    <rect x="6" y="9"
          width="74" height="70" rx="13"
          fill="#102743"/>

    <g clip-path="url(#workspace-clip)">
      <!-- Left pane -->
      <rect x="11" y="14"
            width="23" height="60"
            fill="#377DFA"/>

      <!-- Top-right pane -->
      <rect x="38" y="14"
            width="37" height="30"
            fill="#26D8D0"/>

      <!-- Bottom-right pane -->
      <rect x="38" y="48"
            width="37" height="26"
            fill="#95C9FA"/>
    </g>
  </g>

  <!-- Detached multiview group -->
  <rect x="49" y="51"
        width="42" height="36" rx="11"
        fill="#102743"/>

  <g clip-path="url(#floating-clip)">
    <!-- Tab header -->
    <rect x="54" y="56"
          width="32" height="6"
          fill="#2361BC"/>

    <!-- Two views -->
    <rect x="54" y="66"
          width="14" height="16"
          fill="#95C9FA"/>

    <rect x="72" y="66"
          width="14" height="16"
          fill="#26D8D0"/>
  </g>

  <!-- Active tab indicator -->
  <rect x="57" y="58"
        width="12" height="2" rx="1"
        fill="#BCEAFF"/>
</svg>
