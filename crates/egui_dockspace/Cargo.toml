[package]
name = "egui_dockspace"
description = "Deterministic single-surface docking adapter for egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://frankorz.com/dockspace/demo/egui/"
readme = "README.md"
keywords = ["egui", "docking", "gui", "tabs", "layout"]
categories = ["gui"]

[package.metadata.docs.rs]
features = ["wgpu", "accesskit", "serde", "motion"]

[features]
default = ["motion", "x11", "wayland", "wayland-csd-adwaita"]
example-app = ["dep:eframe", "dep:winit"]
winit = ["dep:dockspace_winit", "dep:egui-winit", "dep:winit"]
wgpu = ["winit", "dep:egui-wgpu", "dep:pollster", "dep:web-time", "egui/default_fonts"]
web = ["wgpu", "dep:futures-util", "dep:gloo-timers", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]
accesskit = ["winit", "egui-winit/accesskit"]
x11 = ["dockspace_winit?/x11", "egui-winit?/x11", "egui-wgpu?/x11", "eframe?/x11", "winit?/x11"]
wayland = ["dockspace_winit?/wayland", "egui-winit?/wayland", "egui-wgpu?/wayland", "eframe?/wayland", "winit?/wayland", "winit?/wayland-dlopen"]
wayland-csd-adwaita = ["wayland", "dockspace_winit?/wayland-csd-adwaita", "winit?/wayland-csd-adwaita"]
serde = ["dockspace/serde"]
motion = ["dockspace/motion"]
# Internal seam consumed by the unpublished fork-backed native adapter. This
# deliberately exposes only sessionless paint/measurement helpers; it does not
# create or own a docking session.
native-render-support = []

[dependencies]
dockspace = { workspace = true, default-features = false }
dockspace_winit = { workspace = true, optional = true, default-features = false }
eframe = { workspace = true, optional = true, features = ["default_fonts", "glow"] }
egui.workspace = true
egui-wgpu = { version = "0.37.0", optional = true, features = ["winit"] }
egui-winit = { version = "0.37.0", optional = true, default-features = false, features = ["links"] }
thiserror.workspace = true
web-time = { version = "1.1", optional = true }
winit = { workspace = true, optional = true, features = ["rwh_06"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { version = "0.37.0", optional = true, default-features = false, features = ["clipboard"] }
pollster = { version = "1.0.1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std", "async-await"] }
gloo-timers = { version = "0.4", optional = true, features = ["futures"] }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Event", "EventTarget", "HtmlCanvasElement", "Node", "Window", "console"] }

[dev-dependencies]
dockspace = { workspace = true, default-features = false }
dockspace_host_conformance = { path = "../dockspace_host_conformance" }
egui = { workspace = true, features = ["default_fonts"] }
proptest.workspace = true
tempfile = "3.27.0"

[[example]]
name = "workbench"
required-features = ["wgpu"]
test = true

[[example]]
name = "winit"
required-features = ["wgpu"]
test = false

[[example]]
name = "custom_winit"
required-features = ["wgpu"]
test = true

[[example]]
name = "ide_workflows"
required-features = ["wgpu"]
test = true

[[example]]
name = "basic"
required-features = ["example-app"]
test = true

[[example]]
name = "composable"
required-features = ["example-app"]
test = true

[[example]]
name = "shared_grid"
required-features = ["wgpu"]
test = true

[[example]]
name = "background_save"
required-features = ["example-app"]
test = true

[[example]]
name = "workspace_persistence"
required-features = ["wgpu", "serde"]
test = true

[lints]
workspace = true
